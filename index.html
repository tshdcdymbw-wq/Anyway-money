const $=id=>document.getElementById(id);function tierFor(cost){return tiers.find(t=>cost<=t.max)||tiers[tiers.length-1]}function fmt(n){return new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n)}
function buildGallery(){const g=$('gallery');g.innerHTML=tiers.map((t,i)=>`<article class="tier" data-tier="${i}"><div class="thumb"><img src="${t.src}" alt="${t.name}"><div class="mystery"></div></div><div class="tier-label">$${t.cost}${i===tiers.length-1?'+':''}</div></article>`).join('')}
function calculate(){const cost=Number($('cost').value)||0,nights=Number($('nights').value)||0,rooms=Number($('rooms').value)||0,years=Number($('years').value)||0,tax=(Number($('tax').value)||0)/100;const annual=cost*nights*rooms*(1+tax);const factor=years===0?0:(Math.pow(1+inflation,years)-1)/inflation;const total=annual*factor;$('amount').textContent='$ '+fmt(total);const tier=tierFor(cost),idx=tiers.indexOf(tier),frame=$('hero-frame'),img=$('hotel-image');frame.classList.add('changing');clearTimeout(window.__t);window.__t=setTimeout(()=>{img.src=tier.src;img.alt=tier.name+' interior';frame.classList.remove('changing')},120);document.querySelectorAll('.tier').forEach((el,i)=>el.classList.toggle('selected',i===idx))}
buildGallery();$('cost').value='250';calculate();$('calcButton').addEventListener('click',calculate);['cost','nights','rooms','years','tax'].forEach(id=>{$(id).addEventListener('input',calculate);$(id).addEventListener('change',calculate)});
</script></body></html>
